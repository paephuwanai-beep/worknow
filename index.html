<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Handover IPD3</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --bg-body: #f0f4f8; --bg-card: #ffffff;
            --text-main: #1e293b; --text-muted: #64748b;
            --primary: #0f766e; --border-color: #e2e8f0; --accent: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; overflow-x: hidden;}

        #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .progress-container { width: 80%; max-width: 400px; height: 10px; background: #e2e8f0; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }
        .loading-text { margin-top: 15px; font-weight: 600; color: var(--primary); font-size: 1.1rem; }

        header { background-color: #111827; padding: 15px 0; position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .brand { background-color: var(--bg-card); padding: 8px 16px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        .brand-text { font-size: 1.2rem; font-weight: 700; color: var(--primary); display: flex; align-items: center;}
        .patient-count-badge { font-size: 0.8rem; background: var(--accent); color: #fff; padding: 2px 10px; border-radius: 12px; margin-left: 10px; font-weight: 500; }
        .btn-outline { background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; }

        .pen-toolbar { position: sticky; top: 68px; z-index: 90; background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 8px 20px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .tool-btn { background: none; border: 1px solid transparent; color: var(--text-muted); font-size: 1.1rem; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .tool-btn.active { color: var(--accent); background: #eff6ff; border-color: #bfdbfe; }
        .color-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { transform: scale(1.15); border-color: var(--text-main); }
        .size-slider { width: 100px; cursor: pointer; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .patient-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .card-header { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid var(--primary); padding-bottom: 12px; margin-bottom: 20px; }
        .bed-badge { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
        
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
        .info-item { padding: 12px; border-bottom: 1px dashed var(--border-color); border-right: 1px dashed var(--border-color); display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: 0.2s;}
        .info-item:hover { background-color: #f0f9ff; }
        .info-item:nth-child(even) { border-right: none; }
        .info-item.full-width { grid-column: 1 / -1; border-right: none; }
        .info-label { font-size: 0.85rem; font-weight: 600; color: var(--primary); }
        .info-val { font-size: 1rem; color: var(--text-main); line-height: 1.5; pointer-events: none; }

        .note-section { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .text-note { width: 100%; height: 60px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; font-size: 0.95rem; resize: vertical; }
        
        .canvas-wrapper { position: relative; background-color: #fafafa; background-image: linear-gradient(#f0f0f0 1px, transparent 1px), linear-gradient(90deg, #f0f0f0 1px, transparent 1px); background-size: 20px 20px; border: 1px solid var(--border-color); border-radius: 6px; height: 300px; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

        .photo-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .photo-thumb { position: relative; width: 80px; height: 80px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); flex-shrink: 0; }
        .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .photo-del { position: absolute; top: 2px; right: 2px; background: rgba(239,68,68,0.8); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem; cursor: pointer; }

        .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .input-group label { font-size: 0.85rem; font-weight: 600; color: var(--primary); }
        .input-group input { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-family: inherit; font-size: 0.95rem; }

        .order-table-wrapper { overflow-x: auto; background: #fff; border: 1px solid var(--border-color); border-radius: 8px; }
        .order-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        .order-table th, .order-table td { padding: 10px; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); font-size: 0.9rem;}
        .order-table th { background: #f8fafc; color: var(--primary); font-weight: 600; white-space: nowrap; }
        .order-table input, .order-table textarea { width: 100%; border: none; background: transparent; font-family: inherit; outline: none; resize: vertical;}
        .order-table textarea { min-height: 40px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 200; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item.active { color: var(--primary); }

        .anatomy-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; align-items:center; justify-content:center; }
        .anatomy-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        .anatomy-btn { border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; font-size: 0.9rem; font-weight: 600;}
        .card-view-selector { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; }
        .bed-pill { background: var(--bg-card); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: 500; }
        .bed-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <i class="fa-solid fa-notes-medical fa-beat" style="font-size: 3.5rem; color: var(--primary);"></i>
        <div class="loading-text">กำลังโหลดข้อมูล... <span id="load-percent">0%</span></div>
        <div class="progress-container"><div class="progress-bar" id="load-bar"></div></div>
    </div>

    <header>
        <div class="header-content">
            <div class="brand">
                <i class="fa-solid fa-notes-medical" style="color:var(--primary);"></i>
                <div class="brand-text">Handover IPD3 <span id="patient-count" class="patient-count-badge">0 ราย</span></div>
            </div>
            <div style="display:flex; gap:10px;">
                <span id="sync-status" style="color:#64748b; font-size:0.8rem; align-self:center;"><i class="fa-solid fa-cloud-check"></i></span>
                <button class="btn-outline" style="border-color:#94a3b8; color:#cbd5e1;" onclick="fetchDataFromServer(true, false)" title="รีเฟรช"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="btn-outline" onclick="openSaveModal()"><i class="fa-solid fa-cloud-arrow-up"></i> บันทึกเวร</button>
            </div>
        </div>
    </header>

    <!-- Toolbar วาดรูป -->
    <div class="pen-toolbar">
        <button class="tool-btn active" id="tool-pen" onclick="setTool('pen')" title="ปากกา"><i class="fa-solid fa-pen"></i></button>
        <button class="tool-btn" id="tool-highlighter" onclick="setTool('highlighter')" title="ไฮไลท์"><i class="fa-solid fa-highlighter"></i></button>
        <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')" title="ยางลบ"><i class="fa-solid fa-eraser"></i></button>
        <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 5px;"></div>
        <button class="tool-btn" id="tool-line" onclick="setTool('line')" title="เส้นตรง"><i class="fa-solid fa-minus"></i></button>
        <button class="tool-btn" id="tool-rect" onclick="setTool('rect')" title="สี่เหลี่ยม"><i class="fa-regular fa-square"></i></button>
        <button class="tool-btn" id="tool-circle" onclick="setTool('circle')" title="วงกลม"><i class="fa-regular fa-circle"></i></button>
        <button class="tool-btn" id="tool-fill" onclick="toggleFill()" title="ระบายสีทึบ"><i class="fa-solid fa-fill-drip"></i></button>
        <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 5px;"></div>
        <div class="color-dot active" style="background:#2563eb;" onclick="setColor('#2563eb', this)"></div>
        <div class="color-dot" style="background:#dc2626;" onclick="setColor('#dc2626', this)"></div>
        <div class="color-dot" style="background:#16a34a;" onclick="setColor('#16a34a', this)"></div>
        <div class="color-dot" style="background:#1e293b;" onclick="setColor('#1e293b', this)"></div>
        <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 5px;"></div>
        <input type="range" id="pen-size" class="size-slider" min="1" max="20" value="2" onchange="updateSize(this.value)">
    </div>

    <div class="container">
        <!-- Views -->
        <div id="view-worklist"></div>
        
        <div id="view-workcard" style="display: none;">
            <div class="card-view-selector" id="bed-pills"></div>
            <div id="single-card-container"></div>
        </div>
        
        <div id="view-neworder" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">
                <h3 style="color:var(--primary);">รายการ New Order</h3>
                <button class="btn-outline" style="background:var(--primary); font-size:0.8rem;" onclick="toggleNewOrderView()"><i class="fa-solid fa-table"></i> สลับมุมมองตาราง</button>
            </div>
            <div id="neworder-cards-view"></div>
            <div id="neworder-table-view" class="order-table-wrapper" style="display:none;">
                <table class="order-table">
                    <thead><tr><th>เตียง</th><th>ชื่อ-สกุล</th><th>I/O</th><th>Film</th><th>D/S</th><th>Consult</th><th>H/C</th><th>LAB</th><th>Note</th></tr></thead>
                    <tbody id="neworder-tbody"></tbody>
                </table>
            </div>
        </div>
        
        <div id="view-history" style="display: none;">
            <div class="patient-card">
                <div style="display:flex; justify-content:space-between;">
                    <h3 style="color:var(--primary);"><i class="fa-solid fa-clock-rotate-left"></i> ประวัติบันทึกเวร (Cloud)</h3>
                    <button class="btn-outline" style="color:var(--primary); border-color:var(--primary); font-size:0.8rem;" onclick="loadCloudHistory()"><i class="fa-solid fa-rotate"></i> อัปเดต</button>
                </div>
                <div style="overflow-x: auto; margin-top: 15px;">
                    <table class="order-table">
                        <thead><tr><th>เวลา</th><th>พยาบาลเวร</th><th>จำนวนเตียง</th><th>จัดการ</th></tr></thead>
                        <tbody id="history-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-worklist" onclick="switchView('worklist')"><i class="fa-solid fa-list"></i> WORK list</button>
        <button class="nav-item" id="nav-workcard" onclick="switchView('workcard')"><i class="fa-regular fa-address-card"></i> WORK card</button>
        <button class="nav-item" id="nav-neworder" onclick="switchView('neworder')"><i class="fa-solid fa-file-medical"></i> New Order</button>
        <button class="nav-item" id="nav-history" onclick="switchView('history')"><i class="fa-solid fa-cloud"></i> History</button>
    </nav>

    <!-- Modal Anatomy -->
    <div class="anatomy-modal" id="anatomy-modal">
        <div style="background:#fff; padding:25px; border-radius:8px; width:90%; max-width:400px;">
            <div style="display:flex; justify-content:space-between;">
                <h3 style="color:var(--primary);">แทรกรูป Anatomy</h3>
                <button onclick="document.getElementById('anatomy-modal').style.display='none'" style="border:none; background:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="anatomy-grid">
                <div class="anatomy-btn" onclick="stampAnatomy('body')">🧍‍♂️<br>Body</div>
                <div class="anatomy-btn" onclick="stampAnatomy('head')">👤<br>Head</div>
                <div class="anatomy-btn" onclick="stampAnatomy('arm')">💪<br>Arm</div>
                <div class="anatomy-btn" onclick="stampAnatomy('leg')">🦵<br>Leg</div>
                <div class="anatomy-btn" onclick="stampAnatomy('lungs')">🫁<br>Lungs</div>
                <div class="anatomy-btn" onclick="stampAnatomy('abdomen')">🫃<br>Abdomen</div>
            </div>
        </div>
    </div>

    <script>
        // *** วาง URL ของคุณที่นี่ ***
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzxYnKisiqrywAuCvHnSMYnobu6DXOtJ3SmJRskHW-KPfmAwTFl3Igyr7PJKi-bYvmW/exec'; 

        let patientsData = [];
        let globalState = {}; 
        let currentTool = 'pen', currentColor = '#2563eb', currentSize = 2, isFillShape = false;
        let activeBed = null, activeCanvasId = null, currentBedIndex = 0, newOrderViewMode = 'card';
        let syncTimeout = null;

        const anatomyImages = {
            body: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="%2364748b" stroke-width="2"><circle cx="50" cy="15" r="8"/><path d="M30 35h40v40H30zM30 35l-15 20M70 35l15 20M40 75v20M60 75v20"/></svg>',
            head: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="%2364748b" stroke-width="2"><circle cx="50" cy="45" r="30"/><path d="M50 75v25M25 100h50"/></svg>',
            arm: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="%2364748b" stroke-width="2"><path d="M20 20c20 0 40 20 40 40s-20 40-40 40"/></svg>',
            leg: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="%2364748b" stroke-width="2"><path d="M40 10v60c0 10 20 10 20 0V10"/></svg>',
            lungs: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="%2364748b" stroke-width="2"><path d="M50 10v30M30 40c-15-10-20 10-10 30s25 20 25-10V40zM70 40c15-10 20 10 10 30s-25 20-25-10V40z"/></svg>',
            abdomen: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="%2364748b" stroke-width="2"><rect x="20" y="20" width="60" height="60" rx="15"/></svg>'
        };

        // --- ตั้งค่าเครื่องมือ ---
        function setTool(tool) {
            currentTool = tool; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
        }
        function setColor(color, elem) {
            currentColor = color; document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            elem.classList.add('active'); if(currentTool === 'eraser') setTool('pen');
        }
        function updateSize(val) { currentSize = val; }
        function toggleFill() {
            isFillShape = !isFillShape; document.getElementById('tool-fill').classList.toggle('active', isFillShape);
        }

        // --- ระบบโหลดข้อมูล ---
        async function fetchDataFromServer(showLoader = true, isSilentSync = false) {
            const loader = document.getElementById('loading-screen');
            const pBar = document.getElementById('load-bar');
            const pText = document.getElementById('load-percent');

            if (showLoader && !isSilentSync) {
                loader.style.display = 'flex';
                pBar.style.width = '10%'; pText.innerText = '10%';
            }

            let percent = 10;
            const interval = setInterval(() => {
                if(percent < 85 && showLoader && !isSilentSync) { 
                    percent += 5; pBar.style.width = percent + '%'; pText.innerText = percent + '%'; 
                }
            }, 50);

            // เคลียร์โครงสร้างเก่าที่มีปัญหาบั๊กก่อนหน้านี้ เพื่อเริ่มใหม่ให้สมบูรณ์
            if(showLoader) localStorage.removeItem('ipd3_local_state');

            try {
                const response = await fetch(GAS_URL);
                if (!response.ok) throw new Error('Network error');
                const resData = await response.json();
                
                clearInterval(interval);
                if(showLoader && !isSilentSync) { pBar.style.width = '100%'; pText.innerText = '100%'; }
                
                if (Array.isArray(resData)) patientsData = resData;
                else patientsData = resData.patients || [];
                
                const remoteState = resData.liveState || {};
                let needRender = false;
                
                patientsData.forEach(pt => {
                    // กำหนดค่าเริ่มต้น ป้องกัน undefined
                    if(!globalState[pt.bed]) {
                        globalState[pt.bed] = { 
                            text: '', canvas: null, stampCount: 0, photos: [], lastUpdate: 0,
                            io: pt.rec !== '-' ? pt.rec : '', film: pt.film !== '-' ? pt.film : '',
                            ds: pt.ds !== '-' ? pt.ds : '', consult: pt.consult !== '-' ? pt.consult : '',
                            hc2: pt.hc2 !== '-' ? pt.hc2 : '', hc5: pt.hc5 !== '-' ? pt.hc5 : '', lab: pt.lab !== '-' ? pt.lab : ''
                        };
                        needRender = true;
                    }
                    if(remoteState[pt.bed] && remoteState[pt.bed].lastUpdate > globalState[pt.bed].lastUpdate) {
                        globalState[pt.bed] = remoteState[pt.bed]; needRender = true;
                    }
                });

                if(showLoader && !isSilentSync) { setTimeout(() => { loader.style.display = 'none'; }, 300); }
                if(needRender || (showLoader && !isSilentSync)) initApp();
                document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-cloud-check" style="color:#10b981;"></i> ซิงก์ล่าสุดเมื่อครู่';
                
            } catch (err) {
                clearInterval(interval);
                if(showLoader && !isSilentSync) loader.style.display = 'none';
                
                if (patientsData.length === 0) {
                    patientsData = [ { bed:"01", an:"AN-0000", name:"(ตัวอย่าง) โหลดไม่สำเร็จ", dx:"-", rec:"-", dtx:"-", hct:"-", film:"-", ds:"-", consult:"-", nebulizer1:"-", nebulizer2:"-", onedayStat:"-", hc2:"-", hc5:"-", lab:"-" } ];
                    patientsData.forEach(pt => {
                        if(!globalState[pt.bed]) globalState[pt.bed] = { text: '', canvas: null, stampCount: 0, photos: [], lastUpdate: 0, io:'', film:'', ds:'', consult:'', hc2:'', hc5:'', lab:'' };
                    });
                    initApp();
                }
                if(!isSilentSync) Swal.fire('เกิดข้อผิดพลาด', 'กรุณาตรวจสอบอินเทอร์เน็ต ระบบแสดงข้อมูลจำลองแทน', 'warning');
                document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-cloud-xmark" style="color:#ef4444;"></i> ออฟไลน์';
            }
        }

        // --- ระบบซิงก์ข้อมูลอัตโนมัติ (Delay 2 วิ) ---
        function triggerCloudSync() {
            clearTimeout(syncTimeout);
            document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังซิงก์...';
            
            // ใช้ Delay 2.5 วินาที เพื่อไม่ให้เซิร์ฟเวอร์ค้าง
            syncTimeout = setTimeout(async () => {
                try {
                    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({action: 'sync_live', state: globalState}) });
                    document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-cloud-check" style="color:#10b981;"></i> ซิงก์ล่าสุดเมื่อครู่';
                } catch(e) {
                    document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-cloud-xmark" style="color:#ef4444;"></i> ซิงก์ไม่สำเร็จ';
                }
            }, 2500);
        }

        function initApp() {
            document.getElementById('patient-count').innerText = `${patientsData.length} ราย`;
            renderWorkList(); renderNewOrder(); buildCardPills();
            if(document.getElementById('view-workcard').style.display === 'block') renderSingleCard(currentBedIndex);
            
            // อัปเดตข้อมูลตาราง New Order ให้ตรงกับ State
            patientsData.forEach(pt => {
                ['io', 'film', 'ds', 'consult', 'hc2', 'hc5', 'lab'].forEach(field => {
                    const val = globalState[pt.bed][field] || '';
                    document.querySelectorAll(`[data-bind="${pt.bed}-${field}"]`).forEach(el => el.value = val);
                });
            });

        // --- ระบบกล้อง & แชร์ ---
        async function handlePhotoUpload(bed, input) {
            const files = input.files;
            if(!globalState[bed].photos) globalState[bed].photos = [];
            if(globalState[bed].photos.length + files.length > 4) { Swal.fire('คำเตือน', 'แนบรูปได้สูงสุด 4 รูปต่อเตียง', 'warning'); return; }
            Swal.fire({title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
            
            for(let i=0; i<files.length; i++) {
                const base64 = await compressImage(files[i]); globalState[bed].photos.push(base64);
            }
            globalState[bed].lastUpdate = Date.now(); triggerCloudSync(); Swal.close(); renderPhotosDOM(bed);
        }

        function compressImage(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 800; let w = img.width, h = img.height;
                        if(w > h && w > MAX) { h *= MAX/w; w = MAX; } else if(h > MAX) { w *= MAX/h; h = MAX; }
                        canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

            Swal.fire({title: 'กำลังเตรียมไฟล์...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});

        // --- Canvas Engine ---
        function setupCanvas(canvasId, bed) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || canvas.getBoundingClientRect().width === 0) return;
            const ctx = canvas.getContext('2d');
            
            const enforceSize = () => {
                const rect = canvas.parentElement.getBoundingClientRect();
                if(rect.width > 0 && canvas.width !== Math.floor(rect.width)) {
                    canvas.width = rect.width; canvas.height = rect.height;
                    if (globalState[bed].canvas) {
                        const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = globalState[bed].canvas;
                    }
                }
            };
            enforceSize();

            let isDrawing = false, startX, startY, snapshot;
            canvas.addEventListener('pointerdown', (e) => {
                if (e.pointerType !== 'pen' && e.pointerType !== 'mouse') return;
                enforceSize();
                isDrawing = true; startX = e.offsetX; startY = e.offsetY;
                snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
                ctx.beginPath(); ctx.moveTo(startX, startY);
                if (currentTool === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = currentSize * 10; }
                else {
                    ctx.globalCompositeOperation = 'source-over'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.strokeStyle = currentTool === 'highlighter' ? currentColor + '44' : currentColor;
                    ctx.fillStyle = currentColor; ctx.lineWidth = currentTool === 'highlighter' ? currentSize * 6 : currentSize;
                }
                e.preventDefault();
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDrawing) return;
                if(['line', 'rect', 'circle'].includes(currentTool)) {
                    ctx.putImageData(snapshot, 0, 0); ctx.beginPath();
                    if(currentTool === 'line') { ctx.moveTo(startX, startY); ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }
                    else if(currentTool === 'rect') { const w = e.offsetX - startX; const h = e.offsetY - startY; if(isFillShape) { ctx.globalAlpha = 0.5; ctx.fillRect(startX, startY, w, h); ctx.globalAlpha=1.0; } ctx.rect(startX, startY, w, h); ctx.stroke(); }
                    else if(currentTool === 'circle') { const r = Math.sqrt(Math.pow(startX-e.offsetX,2) + Math.pow(startY-e.offsetY,2)); ctx.arc(startX, startY, r, 0, 2*Math.PI); if(isFillShape) { ctx.globalAlpha = 0.5; ctx.fill(); ctx.globalAlpha=1.0; } ctx.stroke(); }
                } else { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }
                e.preventDefault();
            });

            const stopDraw = () => { 
                if (isDrawing) { 
                    isDrawing = false; 
                    globalState[bed].canvas = canvas.toDataURL(); 
                    globalState[bed].lastUpdate = Date.now(); 
                    triggerCloudSync(); 
                } 
            };
            canvas.addEventListener('pointerup', stopDraw); canvas.addEventListener('pointerleave', stopDraw);
        }

        function prepareAnatomy(bed, canvasId) { activeBed = bed; activeCanvasId = canvasId; document.getElementById('anatomy-modal').style.display = 'flex'; }
        function stampAnatomy(part) {
            if(!activeCanvasId) return;
            const canvas = document.getElementById(activeCanvasId); const ctx = canvas.getContext('2d');
            const imgSize = 90; const padding = 10; let count = globalState[activeBed].stampCount || 0;
            if(canvas.width === 0) { const rect = canvas.parentElement.getBoundingClientRect(); canvas.width = rect.width; canvas.height = rect.height; }
            
            const cols = Math.max(1, Math.floor(canvas.width / (imgSize + padding)));
            const x = (count % cols) * (imgSize + padding) + padding; const y = Math.floor(count / cols) * (imgSize + padding) + padding;
            
            const img = new Image();
            img.onload = () => {
                ctx.globalAlpha = 0.5; ctx.drawImage(img, x, y, imgSize, imgSize); ctx.globalAlpha = 1.0;
                globalState[activeBed].stampCount = count + 1; globalState[activeBed].canvas = canvas.toDataURL(); globalState[activeBed].lastUpdate = Date.now();
                triggerCloudSync(); document.getElementById('anatomy-modal').style.display = 'none';
            };
            img.src = anatomyImages[part];
        }

        }

        async function confirmSaveCloud(nurseName) {
            const record = { id: Date.now(), time: new Date().toLocaleString('th-TH'), nurse: nurseName, count: patientsData.length, state: globalState };
            Swal.fire({title: 'กำลังอัปโหลด...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
            try {
                await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({action: 'save_history', data: record}) });
                Swal.fire('สำเร็จ!', 'บันทึกส่งเวรเข้าประวัติแล้ว', 'success');
                switchView('history'); loadCloudHistory();
            } catch(e) { Swal.fire('ข้อผิดพลาด', 'อัปโหลดไม่สำเร็จ', 'error'); }
        }

        async function loadCloudHistory() {
            const tbody = document.getElementById('history-list');
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> โหลดประวัติ...</td></tr>`;
            try {
                const res = await fetch(GAS_URL + '?action=history'); const history = await res.json();
                tbody.innerHTML = '';
                if(history.length === 0) { tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">ยังไม่มีประวัติ</td></tr>`; return; }
                history.reverse().forEach(h => {
                    tbody.innerHTML += `<tr>
                        <td>${h.time}</td><td style="color:var(--primary); font-weight:500;">${h.nurse}</td><td>${h.count} เตียง</td>
                        <td><button class="btn-outline" style="background:var(--accent); font-size:0.8rem;" onclick='restoreHistoryState(${JSON.stringify(h.state).replace(/'/g, "&#39;")})'>เปิดดู</button></td>
                    </tr>`;
                });
            } catch(e) { tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">โหลดประวัติล้มเหลว</td></tr>`; }
        }

        function restoreHistoryState(savedState) {
            if(!savedState) return;
            Swal.fire({ title: 'เปิดประวัติเวร?', text: "ข้อมูลปัจจุบันจะถูกแทนที่ด้วยข้อมูลจากประวัติ", icon: 'warning', showCancelButton: true, confirmButtonColor: '#2563eb', confirmButtonText: 'ตกลง', cancelButtonText: 'ยกเลิก' }).then((r) => {
                if(r.isConfirmed) {
                    globalState = savedState; triggerCloudSync(); initApp(); switchView('worklist'); Swal.fire('สำเร็จ', 'โหลดข้อมูลประวัติเรียบร้อย', 'success');
                }
            });
        }

        window.onload = () => fetchDataFromServer(true, false);
    </script>
</body>
</html>
